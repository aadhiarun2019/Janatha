```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Janatha Library - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Janatha Library Admin</h1>

        <a href="/" class="btn btn-outline-secondary">
            View Website
        </a>

    </div>


    <!-- Add Notice -->
    <div class="card mb-4">

        <div class="card-header">
            <h4 class="mb-0">Add Notice</h4>
        </div>

        <div class="card-body">

            <form id="noticeForm">

                <!-- English -->
                <div class="mb-3">

                    <label
                        for="title_en"
                        class="form-label"
                    >
                        English Notice
                    </label>

                    <input
                        type="text"
                        id="title_en"
                        class="form-control"
                        placeholder="Enter English notice"
                        required
                    >

                </div>


                <!-- Malayalam -->
                <div class="mb-3">

                    <label
                        for="title_ml"
                        class="form-label"
                    >
                        Malayalam Notice
                    </label>

                    <input
                        type="text"
                        id="title_ml"
                        class="form-control"
                        placeholder="Enter Malayalam notice"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Notice
                </button>

            </form>


            <!-- Success / Error message -->
            <div
                id="message"
                class="mt-3"
            ></div>

        </div>

    </div>


    <!-- Existing Notices -->
    <div class="card">

        <div class="card-header">
            <h4 class="mb-0">
                Existing Notices
            </h4>
        </div>

        <div class="card-body">

            <div id="noticeList">
                Loading notices...
            </div>

        </div>

    </div>

</div>


<script>


// ========================================
// LOAD EXISTING NOTICES
// ========================================

async function loadNotices() {

    try {

        const response = await fetch("/api/notices");


        if (!response.ok) {

            throw new Error(
                "Failed to load notices"
            );

        }


        const notices =
            await response.json();


        const list =
            document.getElementById(
                "noticeList"
            );


        // No notices
        if (notices.length === 0) {

            list.innerHTML = `
                <p class="text-muted">
                    No notices found.
                </p>
            `;

            return;
        }


        // Clear old content
        list.innerHTML = "";


        // Display notices
        notices.forEach(notice => {

            const div =
                document.createElement("div");


            div.className =
                "border rounded p-3 mb-3";


            div.innerHTML = `

                <div class="mb-2">

                    <strong>
                        English:
                    </strong>

                    <div>
                        ${notice.title_en}
                    </div>

                </div>


                <div class="mb-3">

                    <strong>
                        Malayalam:
                    </strong>

                    <div>
                        ${notice.title_ml}
                    </div>

                </div>


                <button
                    class="btn btn-sm btn-danger"
                    onclick="deleteNotice(${notice.id})"
                >
                    Delete
                </button>

            `;


            list.appendChild(div);

        });

    }

    catch (error) {

        document.getElementById(
            "noticeList"
        ).innerHTML = `
            <p class="text-danger">
                Failed to load notices.
            </p>
        `;

        console.error(error);

    }

}


// ========================================
// ADD NOTICE
// ========================================

document
    .getElementById("noticeForm")
    .addEventListener(
        "submit",
        async function(event) {

            // Prevent page refresh
            event.preventDefault();


            // Get form values
            const title_en =
                document
                    .getElementById("title_en")
                    .value
                    .trim();


            const title_ml =
                document
                    .getElementById("title_ml")
                    .value
                    .trim();


            const message =
                document.getElementById(
                    "message"
                );


            try {

                // Send JSON to FastAPI
                const response =
                    await fetch(
                        "/api/admin/notices",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                title_en:
                                    title_en,

                                title_ml:
                                    title_ml

                            })
                        }
                    );


                // Read response
                const data =
                    await response.json();


                // Handle error
                if (!response.ok) {

                    message.innerHTML = `
                        <div class="alert alert-danger">
                            ${
                                data.detail ||
                                "Failed to add notice."
                            }
                        </div>
                    `;

                    console.error(
                        "API error:",
                        data
                    );

                    return;
                }


                // Success
                message.innerHTML = `
                    <div class="alert alert-success">
                        Notice added successfully.
                    </div>
                `;


                // Clear form
                document
                    .getElementById(
                        "noticeForm"
                    )
                    .reset();


                // Reload notices
                await loadNotices();

            }

            catch (error) {

                console.error(error);

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Something went wrong.
                    </div>
                `;

            }

        }
    );


// ========================================
// DELETE NOTICE
// ========================================

async function deleteNotice(id) {

    if (
        !confirm(
            "Are you sure you want to delete this notice?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/admin/notices/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Failed to delete notice."
            );

            return;
        }


        // Reload list
        await loadNotices();

    }

    catch (error) {

        console.error(error);

        alert(
            "Something went wrong while deleting the notice."
        );

    }

}


// ========================================
// INITIAL LOAD
// ========================================

loadNotices();

</script>

</body>

</html>
```

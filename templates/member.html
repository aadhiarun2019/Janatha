<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member - Janatha Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .card {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout {
            background: #222;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Member Area</h1>
        <p id="welcome">Loading...</p>
        <p>You are logged in as a library member.</p>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <script>
        async function loadMember() {
            const response = await fetch("/api/auth/me");
            const data = await response.json();

            if (!data.authenticated || data.role !== "member") {
                window.location.href = "/";
                return;
            }

            document.getElementById("welcome").textContent =
                `Welcome, ${data.full_name}`;
        }

        async function logout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }

        loadMember();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janatha Reading Room &amp; Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6f1626; --maroon-deep:#4c0e1b;
    --gold:#c9a12b; --gold-light:#e8cf8a;
    --navy:#0c2038; --navy-deep:#081627;
    --paper:#f4ecd8; --paper-dark:#e8dcc0;
    --ink:#241d15; --ink-soft:#5a5044; --green-leaf:#7c8a4a;
    --shadow: 0 12px 28px rgba(12,32,56,0.28);
  }
  *{box-sizing:border-box;}
  html[lang="ml"] body{font-family:'Noto Sans Malayalam','Inter',sans-serif;}
  html[lang="en"] body{font-family:'Inter','Noto Sans Malayalam',sans-serif;}
  html[lang="ml"] .display{font-family:'Noto Serif Malayalam','Fraunces',serif;}
  html[lang="en"] .display{font-family:'Fraunces','Noto Serif Malayalam',serif;}
  body{margin:0;background:radial-gradient(circle at 20% -10%, #16375c 0%, transparent 45%),radial-gradient(circle at 90% 0%, #0d2947 0%, transparent 40%),linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);color:var(--ink);min-height:100vh;}
  .page{max-width:1080px;margin:0 auto;padding:0 20px 60px;}
  .site-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 4px 22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:16px;}
  .logo{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  .brand-text h1{margin:0;color:var(--gold-light);font-size:1.5rem;line-height:1.25;letter-spacing:0.2px;}
  .brand-text .sub{margin:2px 0 0;color:#b9c6d6;font-size:0.85rem;}
  .header-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .lang-switch{display:flex;background:rgba(255,255,255,0.08);border-radius:999px;padding:3px;border:1px solid rgba(232,207,138,0.35);}
  .lang-btn{border:none;background:transparent;color:#cdd9e6;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:background 0.2s ease, color 0.2s ease;}
  .lang-btn.active{background:var(--gold);color:var(--maroon-deep);}
  .notice-ticker{background:var(--maroon);border-top:1px solid rgba(232,207,138,0.45);border-bottom:1px solid rgba(232,207,138,0.45);overflow:hidden;white-space:nowrap;margin:0 2px;border-radius:8px 8px 0 0;}
  .notice-ticker[hidden]{display:none;}
  .notice-ticker-track{display:inline-block;padding-left:100%;animation:ticker-scroll 26s linear infinite;}
  .notice-ticker:hover .notice-ticker-track{animation-play-state:paused;}
  .notice-ticker-track span{display:inline-block;margin:0 36px;padding:9px 0;font-size:0.82rem;font-weight:600;color:#fceecb;letter-spacing:0.2px;}
  @keyframes ticker-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 2px;border-bottom:3px solid var(--gold);}
  .tab-btn{background:rgba(244,236,216,0.12);color:#e7ddc4;border:none;padding:12px 20px 10px;font-size:0.9rem;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;position:relative;top:2px;transition:background 0.2s ease, color 0.2s ease;}
  .tab-btn.active{background:var(--paper);color:var(--maroon-deep);}
  .tab-btn:hover:not(.active){background:rgba(244,236,216,0.22);}
  main{background:var(--paper);border-radius:0 12px 12px 12px;box-shadow:var(--shadow);min-height:420px;}
  .tab-panel{display:none;padding:36px 32px;}
  .tab-panel.active{display:block;animation:fadein 0.35s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .hero{display:flex;gap:34px;align-items:center;flex-wrap:wrap;}
  .hero-text{flex:1;min-width:260px;}
  .hero-text h2{font-size:1.9rem;margin:0 0 10px;color:var(--maroon-deep);}
  .hero-text p{color:var(--ink-soft);line-height:1.7;font-size:0.98rem;max-width:52ch;}
  .hero-badge{width:180px;height:180px;border-radius:50%;flex-shrink:0;border:5px solid var(--gold);box-shadow:var(--shadow);object-fit:cover;}
  .stat-row{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;}
  .stat-card{background:var(--navy);color:var(--gold-light);border-radius:10px;padding:14px 20px;min-width:130px;text-align:center;border-bottom:3px solid var(--gold);}
  .stat-card .num{font-size:1.4rem;font-weight:700;display:block;}
  .stat-card .lbl{font-size:0.72rem;color:#c9d4e2;margin-top:2px;display:block;}
  .divider-leaf{display:flex;align-items:center;gap:10px;margin:34px 0 20px;color:var(--green-leaf);}
  .divider-leaf::before,.divider-leaf::after{content:"";flex:1;height:1px;background:var(--paper-dark);}
  .divider-leaf span{font-size:0.8rem;font-weight:600;color:var(--maroon);}
  .book-grid,.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px;}
  .book-card{background:#fffdf6;border:1px solid var(--paper-dark);border-radius:8px;padding:16px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,0.06);border-left:5px solid var(--maroon);}
  .book-card .day{font-size:0.72rem;font-weight:700;color:var(--maroon);letter-spacing:0.4px;}
  .book-card h3{margin:6px 0 4px;font-size:1.02rem;color:var(--ink);line-height:1.35;}
  .book-card .author{font-size:0.85rem;color:var(--ink-soft);margin:0 0 8px;}
  .book-card .tag{display:inline-block;font-size:0.68rem;background:var(--paper-dark);color:var(--ink-soft);padding:3px 9px;border-radius:999px;}
  .note-box{margin-top:22px;padding:12px 16px;background:rgba(124,138,74,0.12);border-left:4px solid var(--green-leaf);border-radius:6px;font-size:0.82rem;color:var(--ink-soft);}
  .progress-wrap{margin:18px 0 30px;}
  .progress-track{height:14px;background:var(--paper-dark);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--maroon),var(--gold));}
  .progress-label{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--ink-soft);margin-top:6px;}
  .timeline{border-left:3px solid var(--gold);padding-left:22px;display:flex;flex-direction:column;gap:22px;}
  .timeline-item{position:relative;}
  .timeline-item::before{content:"";position:absolute;left:-29px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--maroon);border:2px solid var(--gold);}
  .timeline-item h4{margin:0 0 4px;font-size:0.98rem;color:var(--maroon-deep);}
  .timeline-item p{margin:0;font-size:0.88rem;color:var(--ink-soft);}
  .timeline-date{font-size:0.7rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;}
  .timeline-image{display:block;max-width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin:8px 0;border:1px solid var(--paper-dark);box-shadow:0 3px 8px rgba(0,0,0,0.1);}
  .about-body p{line-height:1.8;color:var(--ink-soft);max-width:66ch;}
  .about-meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;}
  .about-meta div{font-size:0.85rem;color:var(--ink-soft);}
  .about-meta strong{display:block;color:var(--maroon-deep);font-size:0.78rem;margin-bottom:2px;}
  .club-card{background:var(--navy);color:#e7eef6;border-radius:10px;padding:18px;border-top:3px solid var(--gold);}
  .club-card h3{margin:0 0 8px;font-size:1rem;color:var(--gold-light);}
  .club-card p{margin:0;font-size:0.85rem;color:#c4d0de;line-height:1.6;}
  footer{margin-top:26px;padding:22px 6px;text-align:center;color:#b9c6d6;font-size:0.8rem;}
  footer .foot-name{color:var(--gold-light);font-weight:600;display:block;margin-bottom:3px;}
  .form-msg{font-size:0.82rem;color:var(--green-leaf);font-weight:600;min-height:1.2em;}
  [hidden]{display:none !important;}

  /* admin */
  .admin-lock{max-width:360px;margin:20px auto;text-align:center;}
  .admin-lock input{width:100%;padding:11px 12px;border:1px solid var(--paper-dark);border-radius:8px;font-size:0.95rem;margin:14px 0;}
  .admin-lock button{padding:11px 22px;border:none;border-radius:8px;background:var(--maroon);color:#fceecb;font-weight:700;cursor:pointer;}
  .admin-section{border:1px solid var(--paper-dark);border-radius:10px;padding:18px 20px;margin-bottom:22px;background:#fffdf6;}
  .admin-section h3{margin:0 0 14px;color:var(--maroon-deep);font-size:1.02rem;border-bottom:2px solid var(--gold);padding-bottom:8px;}
  .field-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field-col{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;}
  .field-col label{font-size:0.72rem;font-weight:700;color:var(--ink-soft);}
  .field-col input,.field-col textarea{padding:8px 10px;border:1px solid var(--paper-dark);border-radius:6px;font-size:0.88rem;font-family:inherit;background:#fff;}
  .field-col textarea{resize:vertical;min-height:52px;}
  .admin-item{border:1px dashed var(--paper-dark);border-radius:8px;padding:12px;margin-bottom:12px;position:relative;background:#fdfaf1;}
  .admin-item .remove-btn{position:absolute;top:8px;right:8px;background:var(--maroon);color:#fceecb;border:none;border-radius:6px;padding:4px 9px;font-size:0.72rem;cursor:pointer;}
  .add-btn{background:var(--green-leaf);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;}
  .admin-image-preview{display:block;max-width:220px;max-height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--paper-dark);margin-top:4px;}
  .admin-actions{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .save-btn{background:var(--maroon);color:#fceecb;border:none;padding:11px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem;}
  .save-btn:hover{background:var(--maroon-deep);}
  .reset-btn{background:transparent;color:var(--maroon);border:1px solid var(--maroon);padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.85rem;}
  .admin-status{font-size:0.82rem;color:var(--green-leaf);font-weight:600;}
  .admin-warning{font-size:0.76rem;color:var(--ink-soft);background:rgba(201,161,43,0.15);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;margin-bottom:20px;}

  @media (max-width:560px){
    .site-header{padding-top:18px;}
    .brand-text h1{font-size:1.15rem;}
    .tab-panel{padding:24px 18px;}
    .hero{gap:20px;}
    .hero-badge{width:120px;height:120px;}
  }

  /* ---- generic pages / cards ---- */
  .page-title{color:var(--maroon-deep);margin-top:0;}
  .page-intro{color:var(--ink-soft);line-height:1.7;}
  .club-card.light{border-top-color:var(--maroon);background:#fffdf6;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,0.06);}
  .club-card.light h3{color:var(--maroon-deep);}
  .club-card.light p{color:var(--ink-soft);}
  a.link-card{display:block;text-decoration:none;transition:transform 0.15s ease, box-shadow 0.2s ease;}
  a.link-card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.16);}
  .card-more{display:inline-block;margin-top:10px;font-size:0.78rem;font-weight:700;color:var(--maroon);}
  .ticker-link{color:inherit;text-decoration:underline;text-underline-offset:3px;}
  .text-page p{line-height:1.8;color:var(--ink-soft);max-width:66ch;}

  /* ---- admin: structure manager ---- */
  .admin-help{font-size:0.82rem;color:var(--ink-soft);margin:-4px 0 14px;line-height:1.6;}
  .admin-sub{margin:20px 0 10px;font-size:0.92rem;color:var(--maroon);border-bottom:1px solid var(--paper-dark);padding-bottom:4px;}
  .pg-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px;border:1px solid var(--paper-dark);border-radius:8px;background:#fdfaf1;margin-bottom:10px;}
  .pg-main{flex:1;min-width:260px;display:flex;gap:10px;flex-wrap:wrap;}
  .pg-main .field-col{flex:1;min-width:130px;}
  .pg-side{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .pg-side .chk{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--ink-soft);}
  .badge{display:inline-block;font-size:0.68rem;font-weight:700;background:var(--paper-dark);color:var(--ink-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .badge.warn{background:rgba(111,22,38,0.12);color:var(--maroon);}
  .item-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-bottom:8px;}
  .pg-side .item-tools{margin-bottom:0;}
  .mini-btn{width:30px;height:28px;border:1px solid var(--paper-dark);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink-soft);font-size:0.75rem;}
  .mini-btn:hover:not(:disabled){background:var(--paper-dark);}
  .mini-btn:disabled{opacity:0.35;cursor:default;}
  .del-btn{background:var(--maroon);color:#fceecb;border:none;border-radius:6px;padding:5px 10px;font-size:0.72rem;cursor:pointer;}
  .add-page-box{margin-top:14px;padding:14px;border:1px dashed var(--gold);border-radius:8px;background:rgba(201,161,43,0.08);}
  .add-page-box select,.field-col select{padding:8px 10px;border:1px solid var(--paper-dark);border-radius:6px;font-size:0.88rem;font-family:inherit;background:#fff;}
  details.admin-section > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;}
  details.admin-section > summary::-webkit-details-marker{display:none;}
  details.admin-section > summary::before{content:"▸";color:var(--maroon);font-size:0.9rem;transition:transform 0.15s ease;}
  details.admin-section[open] > summary::before{transform:rotate(90deg);}
  details.admin-section > summary h3{margin:0;border:none;padding:0;flex:1;}
  details.admin-section[open] > summary{margin-bottom:14px;border-bottom:2px solid var(--gold);padding-bottom:8px;}
  .admin-check{display:flex;align-items:center;gap:7px;font-size:0.8rem;color:var(--ink-soft);margin-top:6px;}
  .admin-status.err{color:var(--maroon);}

</style>
</head>

// ---------- helpers ----------
const clone = (o)=> JSON.parse(JSON.stringify(o));
const bi = ()=> ({ml:"", en:""});
const t = (k)=> dict[k] ? dict[k][currentLang] : k;
const esc = (s)=> String(s==null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
// text in the current language, falling back to the other language if empty
function L(o){
  if(!o) return "";
  const other = currentLang === "ml" ? "en" : "ml";
  const v = o[currentLang];
  return (v && String(v).trim()) ? v : (o[other] || "");
}
function generateId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("n" + Date.now() + Math.random().toString(36).slice(2, 8));
}
function getByPath(obj, path){
  return path.split(".").reduce((cur, k)=> (cur == null ? undefined : cur[k]), obj);
}
function setPathValue(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    if(cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = value;
}
function safeUrl(u){
  u = (u || "").trim();
  if(!u) return "";
  if(/^www\./i.test(u)) u = "https://" + u;
  return /^(https?:\/\/|mailto:|tel:)/i.test(u) ? u : "";
}

// ---------- content: load / migrate / save ----------
function normalizeContent(raw){
  const d = clone(defaultContent);
  if(!raw || typeof raw !== "object" || Array.isArray(raw)) return d;

  if(raw.schema === 2){
    ["site","hero","whatsNew","footer","books","building","about","notices","stats","pages"].forEach(k=>{
      if(raw[k] == null) raw[k] = d[k];
    });
    if(!Array.isArray(raw.pages)) raw.pages = d.pages;
    if(!Array.isArray(raw.notices)) raw.notices = [];
    if(!Array.isArray(raw.stats)) raw.stats = [];
    if(!Array.isArray(raw.books)) raw.books = [];
    if(!raw.building.updates) raw.building.updates = [];
    if(!raw.about.meta) raw.about.meta = [];
    if(!raw.whatsNew.items) raw.whatsNew.items = [];
    raw.pages.forEach(p=>{
      if(!p.id) p.id = generateId();
      if(!p.title) p.title = bi();
      if(p.type === "cards" && !Array.isArray(p.items)) p.items = [];
      if(p.type === "text" && !Array.isArray(p.paragraphs)) p.paragraphs = [];
    });
    return raw;
  }

  // ---- older content (before page structure existed): keep everything the admin already entered ----
  if(Array.isArray(raw.notices)){
    d.notices = raw.notices.map(n=>({id:n.id || generateId(), text:n.text || bi(), link:{type:"none", value:""}, active:n.active !== false}));
  }
  if(raw.hero) d.hero = raw.hero;
  if(Array.isArray(raw.books)) d.books = raw.books;
  if(raw.building) d.building = raw.building;
  if(raw.about) d.about = raw.about;
  if(raw.footer && raw.footer.address) d.footer.address = raw.footer.address;
  if(raw.stats && !Array.isArray(raw.stats)){
    if(raw.stats.reg) d.stats[0].value = raw.stats.reg;
    if(raw.stats.founded) d.stats[1].value = raw.stats.founded;
  }
  const sp = d.pages.find(p=>p.id === "sports");
  if(sp && Array.isArray(raw.sports)) sp.items = raw.sports;
  return d;
}

async function loadContent(){
  try{
    const res = await fetch("/api/content");
    if(res.ok) content = normalizeContent(await res.json());
    else content = normalizeContent(null);
  }catch(e){
    console.warn("Could not reach the server, showing default sample content.", e);
    content = normalizeContent(null);
  }
}

async function persistContent(){
  try{
    const res = await fetch("/api/content", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-password": adminPassword },
      body: JSON.stringify(content)
    });
    return res.ok;
  }catch(e){
    return false;
  }
}

async function verifyAdminPassword(pw){
  try{
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    });
    return res.ok;
  }catch(e){
    return false;
  }
}

// ---------- public site rendering ----------
const visiblePages = ()=> content.pages.filter(p=>p.visible !== false);

function formatDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(currentLang==="ml" ? "ml-IN" : "en-IN", {year:"numeric", month:"short", day:"numeric"});
}

function resolveLink(l){
  if(!l || !l.type || l.type === "none") return null;
  if(l.type === "page"){
    const p = visiblePages().find(x=>x.id === l.value);
    return p ? {kind:"page", id:p.id} : null;
  }
  if(l.type === "url"){
    const u = safeUrl(l.value);
    return u ? {kind:"url", url:u} : null;
  }
  return null;
}
function linkAttrs(r){
  return r.kind === "page"
    ? `href="#${esc(r.id)}" data-goto="${esc(r.id)}"`
    : `href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"`;
}

function renderNoticeTicker(){
  const wrap = document.getElementById("noticeTicker");
  const track = document.getElementById("noticeTickerTrack");
  const active = (content.notices||[]).filter(n=>n.active && L(n.text).trim());
  if(!active.length){
    wrap.hidden = true;
    track.innerHTML = "";
    return;
  }
  const itemsHtml = active.map(n=>{
    const txt = esc(L(n.text));
    const r = resolveLink(n.link);
    return r ? `<span><a class="ticker-link" ${linkAttrs(r)}>${txt}</a></span>` : `<span>${txt}</span>`;
  }).join("");
  // duplicate the sequence so the loop (0% -> -50%) is seamless
  track.innerHTML = itemsHtml + itemsHtml;
  track.style.animationDuration = Math.max(18, active.length * 10) + "s";
  wrap.hidden = false;
}

function pageHead(p, withIntro){
  const h = L(p.heading) || L(p.title);
  const intro = withIntro ? L(p.intro) : "";
  return `<h2 class="display page-title">${esc(h)}</h2>` + (intro ? `<p class="page-intro">${esc(intro)}</p>` : "");
}

};

function renderNav(){
  const btn = (id, label)=>`<button class="tab-btn${id===activeTab ? " active" : ""}" data-tab="${esc(id)}">${esc(label)}</button>`;
  document.getElementById("tabNav").innerHTML =
    visiblePages().map(p=>btn(p.id, L(p.title))).join("") + btn("admin", t("tabAdmin"));
}

function renderPanels(){
  document.getElementById("pagePanels").innerHTML = visiblePages().map(p=>{
    const fn = PAGE_RENDERERS[p.type] || PAGE_RENDERERS.text;
    return `<section class="tab-panel${p.id===activeTab ? " active" : ""}" data-panel="${esc(p.id)}">${fn(p)}</section>`;
  }).join("");
  document.getElementById("admin").classList.toggle("active", activeTab === "admin");
}

function renderPublic(){
  const pages = visiblePages();
  if(activeTab !== "admin" && !pages.some(p=>p.id === activeTab)) activeTab = pages.length ? pages[0].id : "admin";
  const name = L(content.site.name);
  document.getElementById("siteNameEl").textContent = name;
  document.getElementById("siteLocEl").textContent = L(content.site.location);
  document.getElementById("footNameEl").textContent = name;
  document.getElementById("footAddressEl").textContent = L(content.footer.address);
  document.getElementById("footRegEl").textContent = L(content.footer.reg);
  if(name) document.title = name;
  renderNoticeTicker();
  renderNav();
  renderPanels();
}

function showTab(id){
  const pages = visiblePages();
  if(id !== "admin" && !pages.some(p=>p.id === id)) id = pages.length ? pages[0].id : "admin";
  activeTab = id;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("active", p.dataset.panel === id));
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
}

// ---------- language ----------
function applyLang(lang){
  if(isAdminAuthed) collectFormIntoContent();   // don't lose unsaved typing when switching language
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[key]) el.textContent = dict[key][lang];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const key = el.getAttribute("data-i18n-ph");
    if(dict[key]) el.setAttribute("placeholder", dict[key][lang]);
  });
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  renderPublic();
  if(isAdminAuthed) renderAdminEditor();
}

// ---------- admin editor ----------
const TYPE_LABEL_KEY = {home:"typeHome", books:"typeBooks", building:"typeBuilding", about:"typeAbout", cards:"typeCards", text:"typeText"};
const TEMPLATES = {
  book:  ()=>({day:bi(), title:bi(), author:bi(), tag:bi()}),
  update:()=>({date:"", image:"", title:bi(), body:bi()}),
  item:  ()=>({title:bi(), body:bi()}),
  stat:  ()=>({label:bi(), value:bi()}),
  meta:  ()=>({lbl:bi(), val:bi()}),
  notice:()=>({id:generateId(), text:bi(), link:{type:"none", value:""}, active:true}),
  para:  ()=>bi(),
  wn:    ()=>({title:bi(), body:bi(), link:{type:"none", value:""}})
};

function biCols(label, path, multi){
  const v = getByPath(content, path) || {};
  const mk = (lang)=> multi
    ? `<textarea data-path="${path}.${lang}">${esc(v[lang]||"")}</textarea>`
    : `<input data-path="${path}.${lang}" value="${esc(v[lang]||"")}">`;
  return `<div class="field-col"><label>${esc(label)} (${esc(t("ml"))})</label>${mk("ml")}</div>
          <div class="field-col"><label>${esc(label)} (${esc(t("en"))})</label>${mk("en")}</div>`;
}
const biF = (label, path, multi)=> `<div class="field-row">${biCols(label, path, multi)}</div>`;

function itemTools(arrPath, i, len, canDelete=true){
  return `<div class="item-tools">
    <button type="button" class="mini-btn" data-move="${arrPath}:${i}:-1" ${i===0 ? "disabled" : ""} title="${esc(t("btnMoveUp"))}">▲</button>
    <button type="button" class="mini-btn" data-move="${arrPath}:${i}:1" ${i===len-1 ? "disabled" : ""} title="${esc(t("btnMoveDown"))}">▼</button>
    ${canDelete ? `<button type="button" class="del-btn" data-del="${arrPath}:${i}">${esc(t("btnRemove"))}</button>` : ""}
  </div>`;
}

function listBlock(arrPath, renderItem, kind, addKey){
  const arr = getByPath(content, arrPath) || [];
  return arr.map((it,i)=>`<div class="admin-item">${itemTools(arrPath, i, arr.length)}${renderItem(it, i, arrPath + "." + i)}</div>`).join("")
    + `<button type="button" class="add-btn" data-add="${arrPath}|${kind}">${esc(t(addKey))}</button>`;
}

function linkEditor(path, link){
  link = link || {type:"none", value:""};
  const keys = {none:"linkNone", page:"linkPage", url:"linkUrl"};
  const typeSel = `<select data-path="${path}.type" data-rerender>${Object.keys(keys).map(v=>`<option value="${v}"${link.type===v ? " selected" : ""}>${esc(t(keys[v]))}</option>`).join("")}</select>`;
  let extra = "";
  if(link.type === "page"){
    extra = `<div class="field-col"><label>${esc(t("lblLinkPage"))}</label><select data-path="${path}.value">${content.pages.map(p=>`<option value="${esc(p.id)}"${p.id===link.value ? " selected" : ""}>${esc(L(p.title))}</option>`).join("")}</select></div>`;
  }else if(link.type === "url"){
    extra = `<div class="field-col"><label>${esc(t("lblLinkUrl"))}</label><input data-path="${path}.value" value="${esc(link.value||"")}" placeholder="https://"></div>`;
  }
  return `<div class="field-row"><div class="field-col"><label>${esc(t("lblLink"))}</label>${typeSel}</div>${extra}</div>`;
}

function pageEditor(p, idx){
  const base = "pages." + idx;
  let html = "";
  if(p.type !== "home") html += biF(t("lblPageHeading"), base + ".heading");
  if(["books","building","cards"].includes(p.type)) html += biF(t("lblPageIntro"), base + ".intro", true);

  if(p.type === "home"){
    html += biF(t("lblHeroTitle"), "hero.title");
    html += biF(t("lblHeroBody"), "hero.body", true);
    html += `<h4 class="admin-sub">${esc(t("secStats"))}</h4>`;
    html += listBlock("stats", (s,i,pp)=>biF(t("lblStatLabel"), pp+".label") + biF(t("lblStatValue"), pp+".value"), "stat", "btnAddStat");
    html += `<h4 class="admin-sub">${esc(t("secWhatsNew"))}</h4>`;
    html += biF(t("lblWnHeading"), "whatsNew.title");
    html += listBlock("whatsNew.items", (it,i,pp)=>
      biF(t("lblWnTitle"), pp+".title") + biF(t("lblWnBody"), pp+".body", true) + linkEditor(pp+".link", it.link), "wn", "btnAddWn");
  }
  else if(p.type === "books"){
    html += listBlock("books", (b,i,pp)=>
      biF(t("lblDay"), pp+".day") + biF(t("lblBookTitle"), pp+".title") + biF(t("lblAuthor"), pp+".author") + biF(t("lblTag"), pp+".tag"), "book", "btnAddBook");
  }
  else if(p.type === "building"){
    html += `<div class="field-row"><div class="field-col"><label>${esc(t("lblProgressPct"))}</label>
      <input type="number" min="0" max="100" data-path="building.progressPercent" value="${esc(content.building.progressPercent)}"></div></div>`;
    html += listBlock("building.updates", (u,i,pp)=>{
      const img = u.image
        ? `<img class="admin-image-preview" src="${esc(u.image)}" alt=""><button type="button" class="del-btn" data-remove-image="${i}" style="margin-top:6px;">${esc(t("btnRemoveImage"))}</button>`
        : `<input type="file" accept="image/*" data-image-upload="${i}">`;
      return `<div class="field-row"><div class="field-col"><label>${esc(t("lblUpdateDate"))}</label><input type="date" data-path="${pp}.date" value="${esc(u.date||"")}"></div></div>`
        + biF(t("lblUpdateTitle"), pp+".title") + biF(t("lblUpdateBody"), pp+".body", true)
        + `<div class="field-row"><div class="field-col"><label>${esc(t("lblUpdateImage"))}</label>${img}</div></div>`;
    }, "update", "btnAddUpdate");
  }
  else if(p.type === "about"){
    html += biF(t("lblAboutP1"), "about.p1", true) + biF(t("lblAboutP2"), "about.p2", true);
    html += listBlock("about.meta", (m,i,pp)=>biF(t("lblMetaLabel"), pp+".lbl") + biF(t("lblMetaValue"), pp+".val"), "meta", "btnAddMeta");
  }
  else if(p.type === "cards"){
    html += listBlock(base + ".items", (it,i,pp)=>biF(t("lblItemTitle"), pp+".title") + biF(t("lblItemBody"), pp+".body", true), "item", "btnAddItem");
  }
  else if(p.type === "text"){
    html += listBlock(base + ".paragraphs", (it,i,pp)=>biF(t("lblParagraph"), pp, true), "para", "btnAddPara");
  }
  return html;
}

function renderAdminEditor(){
  const el = document.getElementById("adminEditorView");
  // remember which sections are open so they stay open after a refresh
  el.querySelectorAll("details[data-sec]").forEach(d=>{
    if(d.open) openSecs.add(d.dataset.sec); else openSecs.delete(d.dataset.sec);
  });
  const isOpen = (k)=> openSecs.has(k) ? " open" : "";
  const pages = content.pages;
  let html = `<div class="admin-warning">${esc(t("adminWarning"))}</div>`;

  // 1) page structure
  html += `<details class="admin-section" data-sec="structure"${isOpen("structure")}><summary><h3>${esc(t("secStructure"))}</h3></summary>
    <p class="admin-help">${esc(t("structureHelp"))}</p>`;
  pages.forEach((p,i)=>{
    const canDelete = p.type === "cards" || p.type === "text";
    html += `<div class="pg-row">
      <div class="pg-main">${biCols(t("lblTabTitle"), "pages."+i+".title")}</div>
      <div class="pg-side">
        <span class="badge">${esc(t(TYPE_LABEL_KEY[p.type] || "typeText"))}</span>
        <label class="chk"><input type="checkbox" data-path="pages.${i}.visible" ${p.visible !== false ? "checked" : ""}> ${esc(t("lblShow"))}</label>
        ${itemTools("pages", i, pages.length, canDelete)}
      </div>
    </div>`;
  });
  html += `<p class="admin-help">${esc(t("adminTabNote"))}</p>
    <div class="add-page-box">
      <strong style="font-size:0.85rem;color:var(--maroon-deep);">${esc(t("secAddPage"))}</strong>
      <div class="field-row" style="margin-top:10px;">
        <div class="field-col"><label>${esc(t("lblPageType"))}</label>
          <select id="newPgType"><option value="cards">${esc(t("optCards"))}</option><option value="text">${esc(t("optText"))}</option></select></div>
        <div class="field-col"><label>${esc(t("lblTabTitle"))} (${esc(t("ml"))})</label><input id="newPgMl"></div>
        <div class="field-col"><label>${esc(t("lblTabTitle"))} (${esc(t("en"))})</label><input id="newPgEn"></div>
      </div>
      <button type="button" class="add-btn" id="addPageBtn">${esc(t("btnAddPage"))}</button>
    </div>
  </details>`;

  // 2) content of each page
  html += `<h4 class="admin-sub" style="margin-top:26px;">${esc(t("secPages"))}</h4>`;
  pages.forEach((p,i)=>{
    const key = "page:" + p.id;
    html += `<details class="admin-section" data-sec="${esc(key)}"${isOpen(key)}>
      <summary><h3>${esc(L(p.title) || "—")}</h3>${p.visible === false ? `<span class="badge warn">${esc(t("badgeHidden"))}</span>` : ""}</summary>
      ${pageEditor(p, i)}
    </details>`;
  });

  // 3) scrolling notices
  html += `<details class="admin-section" data-sec="notices"${isOpen("notices")}><summary><h3>${esc(t("secNotices"))}</h3></summary>`;
  html += listBlock("notices", (n,i,pp)=>
    biF(t("lblNoticeText"), pp+".text") + linkEditor(pp+".link", n.link)
    + `<label class="admin-check"><input type="checkbox" data-path="${pp}.active" ${n.active ? "checked" : ""}> ${esc(t("lblNoticeActive"))}</label>`,
    "notice", "btnAddNotice");
  html += `</details>`;

  // 4) site settings
  html += `<details class="admin-section" data-sec="site"${isOpen("site")}><summary><h3>${esc(t("secSite"))}</h3></summary>
    ${biF(t("lblSiteName"), "site.name")}
    ${biF(t("lblSiteLocation"), "site.location")}
    ${biF(t("lblFooterAddress"), "footer.address")}
    ${biF(t("lblFooterReg"), "footer.reg")}
  </details>`;

  html += `<div class="admin-actions">
    <button type="button" class="save-btn" id="saveAllBtn">${esc(t("btnSaveAll"))}</button>
    <button type="button" class="reset-btn" id="resetDefaultsBtn">${esc(t("btnResetDefaults"))}</button>
    <span class="admin-status" id="adminStatusMsg"></span>
  </div>`;
  el.innerHTML = html;
}

function collectFormIntoContent(){
  document.querySelectorAll("#adminEditorView [data-path]").forEach(inp=>{
    const path = inp.getAttribute("data-path");
    let val;
    if(inp.type === "checkbox") val = inp.checked;
    else if(inp.type === "number") val = Number(inp.value);
    else val = inp.value;
    setPathValue(content, path, val);
  });
}

// repaint the public site + editor from `content`.
// NOTE: callers must run collectFormIntoContent() BEFORE changing `content`, never after
// (the old form still shows the previous structure and would overwrite the change).
function refreshAll(){
  renderPublic();
  renderAdminEditor();
}

function fileToCompressedDataURL(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function setStatus(msg, isError){
  const s = document.getElementById("adminStatusMsg");
  if(!s) return;
  s.textContent = msg;
  s.classList.toggle("err", !!isError);
}

// One set of listeners on the editor container (works for every re-render)
const editorEl = document.getElementById("adminEditorView");

editorEl.addEventListener("click", async (e)=>{
  const btn = e.target.closest("button");
  if(!btn) return;

  if(btn.dataset.add){
    const [path, kind] = btn.dataset.add.split("|");
    collectFormIntoContent();
    getByPath(content, path).push(TEMPLATES[kind]());
    return refreshAll();
  }
  if(btn.dataset.del){
    const [path, idx] = btn.dataset.del.split(":");
    if(path === "pages" && !confirm(t("confirmDeletePage"))) return;
    collectFormIntoContent();
    getByPath(content, path).splice(Number(idx), 1);
    return refreshAll();
  }
  if(btn.dataset.move){
    const [path, idx, dir] = btn.dataset.move.split(":");
    collectFormIntoContent();
    const arr = getByPath(content, path), i = Number(idx), j = i + Number(dir);
    if(j >= 0 && j < arr.length){ [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return refreshAll();
  }
  if(btn.dataset.removeImage !== undefined){
    collectFormIntoContent();
    content.building.updates[Number(btn.dataset.removeImage)].image = "";
    return refreshAll();
  }
  if(btn.id === "addPageBtn"){
    const type = document.getElementById("newPgType").value;
    const ml = document.getElementById("newPgMl").value.trim();
    const en = document.getElementById("newPgEn").value.trim();
    if(!ml && !en){ alert(t("msgPageNeedTitle")); return; }
    collectFormIntoContent();
    const page = {id:"p" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), type, visible:true,
                  title:{ml, en}, heading:{ml, en}, intro:bi()};
    if(type === "cards") page.items = [];
    if(type === "text") page.paragraphs = [{ml:"", en:""}];
    content.pages.push(page);
    openSecs.add("page:" + page.id);
    return refreshAll();
  }
  if(btn.id === "saveAllBtn"){
    collectFormIntoContent();
    const ok = await persistContent();
    renderPublic();
    setStatus(ok ? t("adminSavedMsg") : t("adminSaveFailed"), !ok);
    return;
  }
  if(btn.id === "resetDefaultsBtn"){
    if(!confirm(t("confirmReset"))) return;
    content = clone(defaultContent);
    const ok = await persistContent();
    renderPublic();
    renderAdminEditor();
    setStatus(ok ? t("adminResetMsg") : t("adminSaveFailed"), !ok);
  }
});

editorEl.addEventListener("change", async (e)=>{
  const el = e.target;
  if(el.matches("[data-image-upload]")){
    const file = el.files[0];
    if(!file) return;
    const idx = Number(el.getAttribute("data-image-upload"));
    collectFormIntoContent();
    try{
      content.building.updates[idx].image = await fileToCompressedDataURL(file);
      renderAdminEditor();
    }catch(err){
      console.warn("Could not process image", err);
    }
    return;
  }
  if(el.matches("[data-rerender]")){
    // link type changed: reset the target so it always matches the new type
    collectFormIntoContent();
    const path = el.getAttribute("data-path");
    const base = path.replace(/\.type$/, "");
    const type = el.value;
    setPathValue(content, base + ".value", type === "page" ? (content.pages[0] ? content.pages[0].id : "") : "");
    renderAdminEditor();
    return;
  }
  // structural edits (show/hide) update the live tab bar immediately
  if(el.matches('[data-path^="pages."][data-path$=".visible"]')){
    collectFormIntoContent();
    refreshAll();
  }
});

// ---------- wiring ----------
document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click", ()=> applyLang(btn.getAttribute("data-lang")));
});

document.getElementById("tabNav").addEventListener("click", (e)=>{
  const b = e.target.closest(".tab-btn");
  if(b) showTab(b.dataset.tab);
});

// links on the Home page ("What's new" cards, notices) that open another tab
document.addEventListener("click", (e)=>{
  const a = e.target.closest("a[data-goto]");
  if(!a) return;
  e.preventDefault();
  showTab(a.dataset.goto);
  const nav = document.getElementById("tabNav");
  if(nav) nav.scrollIntoView({behavior:"smooth", block:"start"});
});

window.addEventListener("hashchange", ()=>{
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && h !== activeTab) showTab(h);
});

async function tryUnlock(){
  const val = document.getElementById("adminPasswordInput").value;
  const ok = await verifyAdminPassword(val);
  if(ok){
    adminPassword = val;
    isAdminAuthed = true;
    document.getElementById("adminLockView").hidden = true;
    document.getElementById("adminEditorView").hidden = false;
    renderAdminEditor();
  }else{
    document.getElementById("adminLockMsg").textContent = t("adminWrongPassword");
  }
}
document.getElementById("adminUnlockBtn").addEventListener("click", tryUnlock);
document.getElementById("adminPasswordInput").addEventListener("keydown", (e)=>{ if(e.key === "Enter") tryUnlock(); });

(async function init(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h) activeTab = h;
  await loadContent();
  applyLang("ml");
})();
</script>
